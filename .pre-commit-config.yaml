repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff lint
        entry: uv run ruff check
        language: system
        types:
          - python
      - id: workflow-action-pins
        name: GitHub Actions use immutable commit pins
        entry: uv run python scripts/check_workflow_action_pins.py
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: false
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        args:
          - --maxkb=512
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args:
          - --fix=lf
      - id: trailing-whitespace
