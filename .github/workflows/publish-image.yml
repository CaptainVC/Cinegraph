name: Publish immutable image

on:
  workflow_run:
    workflows: [Quality]
    types: [completed]
    branches: [main]

concurrency:
  group: publish-image-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/captainvc/cinegraph

jobs:
  publish:
    name: Publish immutable amd64 image
    if: >-
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'Quality' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Resolve release commit
        id: release
        shell: bash
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          release_sha="$WORKFLOW_RUN_SHA"
          if [[ ! "$release_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release SHA is not a lowercase 40-character commit SHA" >&2
            exit 1
          fi
          echo "sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$release_sha" >> "$GITHUB_OUTPUT"

      - name: Check out exact release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR with GITHUB_TOKEN
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing release tag
        shell: bash
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          token_file="$RUNNER_TEMP/ghcr-pull-token.json"
          umask 077
          trap 'rm -f "$token_file"' EXIT
          curl --fail --silent --show-error \
            --user "$GHCR_ACTOR:$GHCR_TOKEN" \
            --output "$token_file" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:captainvc/cinegraph:pull"
          pull_token="$(jq --exit-status --raw-output '.token // .access_token' "$token_file")"
          if [[ -z "$pull_token" ]]; then
            echo "GHCR did not return a scoped pull token; refusing to publish" >&2
            exit 1
          fi
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request HEAD \
            --header "Authorization: Bearer $pull_token" \
            --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/captainvc/cinegraph/manifests/${{ steps.release.outputs.tag }}")"
          if [[ "$status" == "200" ]]; then
            echo "Immutable release tag already exists; refusing to overwrite it" >&2
            exit 1
          fi
          if [[ "$status" != "404" ]]; then
            echo "Could not prove that the release tag is absent (registry status $status); refusing to publish" >&2
            exit 1
          fi

      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.release.outputs.tag }}
          build-args: |
            VERSION=sha-${{ steps.release.outputs.sha }}
            REVISION=${{ steps.release.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/CaptainVC/Cinegraph
            org.opencontainers.image.revision=${{ steps.release.outputs.sha }}
            org.opencontainers.image.version=sha-${{ steps.release.outputs.sha }}
          cache-from: type=gha,scope=cinegraph-image
          cache-to: type=gha,mode=max,scope=cinegraph-image
          sbom: true
          provenance: mode=max

      - name: Create GitHub OIDC-signed provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
