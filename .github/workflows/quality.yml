name: Quality

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-type:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Install locked development dependencies
        run: uv sync --locked --dev
      - name: Run Ruff
        run: uv run ruff check .
      - name: Run mypy
        run: uv run mypy

  tests-coverage-build:
    name: Tests, branch coverage, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Install locked development dependencies
        run: uv sync --locked --dev
      - name: Run tests with branch coverage
        run: >-
          uv run pytest --cov --cov-report=term-missing --cov-report=xml
          --cov-report=json
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.run_id }}
          path: |
            coverage.xml
            coverage.json
          if-no-files-found: error
      - name: Build wheel
        run: uv build --wheel

  postgres-contract:
    name: PostgreSQL persistence contract
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: cinegraph
          POSTGRES_PASSWORD: cinegraph-contract-only
          POSTGRES_DB: cinegraph
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cinegraph -d cinegraph"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Install locked development dependencies
        run: uv sync --locked --dev
      - name: Run PostgreSQL migration and persistence contract
        env:
          CINEGRAPH_TEST_DATABASE_URL: postgresql+psycopg://cinegraph:cinegraph-contract-only@localhost:5432/cinegraph
        run: uv run pytest tests/integration/identity -q

  evaluation-smoke:
    name: Deterministic evaluation smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Install locked development dependencies
        run: uv sync --locked --dev
      - name: Run invented-fixture retrieval evaluation
        run: uv run python scripts/run_synthetic_evaluation.py

  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Install locked development dependencies
        run: uv sync --locked --dev
      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
