[project]
name = "cinegraph"
version = "0.1.0"
description = "Spoiler-aware, self-hosted intelligence for episodic media"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "fastembed==0.8.0",
    "httpx>=0.28.1",
    "langchain==1.3.14",
    "langchain-openai>=1.3.5",
    "langgraph>=1.2.9",
    "openai>=2.45.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pypdf>=6.15.0",
    "psycopg[binary]>=3.2,<4",
    "pytest-bdd>=8.1.0",
    "qdrant-client==1.19.0",
    "rapidfuzz>=3.14.5",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.52.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cinegraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -m 'not e2e'"
norecursedirs = ["e2e"]
markers = [
    "e2e: browser end-to-end tests requiring a locally running Chromium and API",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = ["knowledge"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.bandit]
exclude_dirs = ["tests", "knowledge", ".venv", "build", "dist"]

[tool.coverage.run]
branch = true
source = ["src/cinegraph"]

[tool.coverage.report]
fail_under = 87
show_missing = true

[tool.coverage.xml]
output = "coverage.xml"

[tool.coverage.json]
output = "coverage.json"

[tool.mypy]
python_version = "3.12"
files = [
    "src/cinegraph/domain",
    "src/cinegraph/ports",
    "src/cinegraph/config",
    "src/cinegraph/adapters/identity",
    "src/cinegraph/adapters/persistence",
    "src/cinegraph/application/models",
    "src/cinegraph/application/policy",
    "src/cinegraph/application/serialization",
    "src/cinegraph/application/service",
]
check_untyped_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[dependency-groups]
dev = [
    "bandit==1.9.4",
    "mypy>=1.17,<1.19",
    "pip-audit==2.9.0",
    "playwright>=1.52,<2",
    "pre-commit>=4.3,<5",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12.10,<0.13",
]
